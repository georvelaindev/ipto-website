<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Finaliser l'accès au compte étudiant IPTO.">
    <title>Activation du compte étudiant | IPTO</title>
    <link rel="icon" href="../assets/images/logo-ipto.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/student.css">
    <script type="module" src="../assets/js/student/complete-registration.js"></script>
</head>
<body class="student-page login-page">
    <main class="login-layout">
        <section class="login-intro" aria-labelledby="institution-name">
            <a class="student-brand" href="../index.html">
                <img src="../assets/images/logo-ipto.jpg" alt="Logo de l'IPTO">
                <span><strong>IPTO</strong><small>Institut Professionnel et Technologique d'Oyo</small></span>
            </a>
            <div class="login-intro-copy">
                <p class="student-eyebrow">Portail étudiant</p>
                <h1 id="institution-name">Encore une étape.</h1>
                <p>Confirmez votre adresse e-mail pour activer votre espace étudiant.</p>
            </div>
            <a class="back-to-site" href="../index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Retour au site de l'IPTO</a>
        </section>

        <section class="login-panel" aria-labelledby="activation-title">
            <div class="login-card">
                <p class="student-eyebrow">Activation du compte</p>
                <h2 id="activation-title">Vérification en cours</h2>
                <div id="activation-feedback" class="student-feedback" role="status" aria-live="polite">Veuillez patienter…</div>
                <p class="login-help"><a href="login.html">Aller à la connexion</a></p>
            </div>
        </section>
    </main>
</body>
</html>
